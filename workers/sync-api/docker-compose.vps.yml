services:
  sync-api:
    build:
      context: ../..
      dockerfile: workers/sync-api/Dockerfile
    container_name: agnes-sync-api
    restart: unless-stopped
    init: true
    mem_limit: 1g
    environment:
      NODE_OPTIONS: --max-old-space-size=384
      SYNC_MEMORY_RESTART_MB: ${SYNC_MEMORY_RESTART_MB:-768}
      SYNC_HEALTH_FAILURE_LIMIT: ${SYNC_HEALTH_FAILURE_LIMIT:-5}
      SYNC_HEALTH_INTERVAL_SECONDS: ${SYNC_HEALTH_INTERVAL_SECONDS:-15}
    security_opt:
      - no-new-privileges:true
    ports:
      - "${SYNC_API_PORT:-8787}:8787"
    healthcheck:
      test: ["CMD", "node", "./healthcheck.mjs"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 60s
    stop_grace_period: 20s
    volumes:
      - ./vps-data:/data
      - ./.dev.vars:/app/workers/sync-api/.dev.vars:ro
