# PipeWire 1.6 monitor-mode AEC template. Select the exported source in Agnes.
# The playback reference follows the system's default output monitor.
# Capture/playback target.object may be pinned to physical node names when
# default-device routing is unsuitable; verify the routes before enabling barge-in.
context.modules = [
    {
        name = libpipewire-module-echo-cancel
        flags = [ ifexists nofail ]
        args = {
            library.name = aec/libspa-aec-webrtc
            monitor.mode = true
            audio.rate = 48000
            audio.channels = 1
            audio.position = [ MONO ]
            capture.props = {
                node.name = "agnes.aec.capture"
                node.passive = true
            }
            source.props = {
                node.name = "agnes.aec.source"
                node.description = "Agnes Echo Cancelled Microphone"
                node.virtual = true
                priority.session = 10
            }
            playback.props = {
                node.name = "agnes.aec.reference"
                node.passive = true
            }
        }
    }
]
